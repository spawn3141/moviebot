# Tests laufen bei jedem Push. Das Image wird NICHT automatisch gebaut – das löst du selbst
# aus: Knopf "Run workflow" im Actions-Reiter oder `gh workflow run docker.yml`. Es landet dann
# in der GitHub Container Registry (ghcr.io), von wo Unraid es zieht.
name: Docker-Image

on:
  push:
    branches: [main]
    tags: ["v*"]          # ein Versions-Tag baut auch – das ist ebenfalls deine Entscheidung
  pull_request:
    branches: [main]
  workflow_dispatch:      # Knopf "Run workflow" im Actions-Reiter

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: python -m unittest --verbose

  image:
    name: Image bauen und hochladen
    # Nur auf Zuruf: Knopf im Actions-Reiter oder ein Versions-Tag. Ein gewöhnlicher Push
    # auf main lässt nur die Tests laufen und fasst das Image nicht an.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: tests                          # kein Image, wenn die Tests rot sind
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Bei ghcr.io anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # von GitHub gestellt, nichts einzurichten

      - name: Namen und Marken bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/moviebot
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Bauen und hochladen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64            # Unraid ist x86_64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
